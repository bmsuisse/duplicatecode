name: Release

# Auto-release: every push to main runs the full CI suite, then publishes iff
# Cargo.toml's [workspace.package] version has no matching `vX.Y.Z` tag yet.
# A release is just "bump the version in a PR and merge it". Publishes:
#   - wheels + sdist to PyPI  -> `uv tool install duplicatecode`
#   - standalone binaries (+ SHA256SUMS) on the GitHub Release -> install.sh
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Report whether a release would happen without building/publishing anything"
        type: boolean
        default: false

# Two quick merges must not race each other into publishing the same version.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  plan:
    name: Detect version bump
    needs: test
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.check.outputs.release }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: check
        run: |
          VERSION=$(grep -m1 '^version = ' Cargo.toml | sed -E 's/version = "(.*)"/\1/')
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            RELEASE=false
          else
            RELEASE=true
          fi
          echo "release=$RELEASE" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "duplicatecode: release=$RELEASE version=$VERSION"

  # Every target builds natively on a matching runner (tree-sitter compiles C,
  # so no cross-compilation). Linux wheels are manylinux for portability.
  build:
    needs: plan
    if: needs.plan.outputs.release == 'true' && (github.event_name != 'workflow_dispatch' || inputs.dry_run != true)
    strategy:
      matrix:
        include:
          - { name: linux-x86_64, runner: ubuntu-latest, target: x86_64-unknown-linux-gnu, manylinux: auto }
          - { name: linux-aarch64, runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, manylinux: auto }
          - { name: macos-x86_64, runner: macos-15-intel, target: x86_64-apple-darwin, manylinux: "off" }
          - { name: macos-aarch64, runner: macos-latest, target: aarch64-apple-darwin, manylinux: "off" }
          - { name: windows-x86_64, runner: windows-latest, target: x86_64-pc-windows-msvc, manylinux: "off" }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.name }}
          path: dist

  sdist:
    needs: plan
    if: needs.plan.outputs.release == 'true' && (github.event_name != 'workflow_dispatch' || inputs.dry_run != true)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-sdist
          path: dist

  publish:
    needs: [plan, build, sdist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: write # push the vX.Y.Z tag + create the GitHub Release
      id-token: write # PyPI trusted publishing (OIDC) -- no stored API token
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          # A re-run after a partial failure must not fail on files that
          # already uploaded -- PyPI rejects re-uploads of the same filename.
          skip-existing: true
      - name: Package standalone binaries from the wheels
        run: |
          mkdir -p assets tmp
          for whl in dist/*.whl; do
            case "$whl" in
              *manylinux*x86_64*) target=x86_64-unknown-linux-gnu ;;
              *manylinux*aarch64*) target=aarch64-unknown-linux-gnu ;;
              *macosx*x86_64*) target=x86_64-apple-darwin ;;
              *macosx*arm64*) target=aarch64-apple-darwin ;;
              *win_amd64*) target=x86_64-pc-windows-msvc ;;
              *) echo "unknown wheel platform: $whl" >&2; exit 1 ;;
            esac
            rm -rf tmp/*
            unzip -q -j "$whl" '*.data/scripts/*' -d tmp
            if [ "$target" = x86_64-pc-windows-msvc ]; then
              (cd tmp && zip -q "../assets/duplicatecode-$target.zip" duplicatecode.exe)
            else
              chmod +x tmp/duplicatecode
              tar -czf "assets/duplicatecode-$target.tar.gz" -C tmp duplicatecode
            fi
          done
          (cd assets && sha256sum * > SHA256SUMS)
          cp dist/*.whl assets/
          ls -l assets
      - name: Tag release
        run: |
          git tag "v${{ needs.plan.outputs.version }}"
          git push origin "v${{ needs.plan.outputs.version }}"
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ needs.plan.outputs.version }}"
          gh release create "$TAG" assets/* --title "duplicatecode $TAG" --generate-notes
