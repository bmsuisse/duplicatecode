[package]
name = "duplicatecode"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "CLI to detect duplicate/similar code in Python and TypeScript"

[[bin]]
name = "duplicatecode"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
duplicatecode-engine = { path = "../duplicatecode-engine" }
serde_json = "1.0.151"
walkdir = "2.5.0"
